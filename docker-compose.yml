name: ifconfig-py

networks:
  default:
    name: ifconfig-network
    driver: bridge

services:
  app:
    container_name: ifconfig-app
    image: albujuk/ifconfig-py
    build: .
    restart: unless-stopped

  nginx:
    container_name: ifconfig-nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
